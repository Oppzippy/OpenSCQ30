name: test macos

on:
  push:
    paths: &push_paths
      - Cargo.lock
      - lib/**
      - .github/workflows/test-macos.yml
  pull_request:
    paths: *push_paths

permissions:
  contents: read

jobs:
  # Only lib is tested on macos since building the gui/cli would take
  # a lot longer. The cli's macOS main() is only built by build.yml.
  test-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        run: brew install just
      - name: Install rust
        run: rustup install --profile minimal stable
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run lib tests
        run: just lib/ test
