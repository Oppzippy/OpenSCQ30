name: test windows

on:
  push:
    paths: &push_paths
      - Cargo.lock
      - lib/**
      - .github/workflows/test-windows.yml
  pull_request:
    paths: *push_paths

permissions:
  contents: read

jobs:
  # Only lib is tested on windows since building the gui/cli would take
  # a lot longer, and they don't contain any platform specific code
  test-rust:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        run: choco install just
      - name: Install rust
        run: rustup install --profile minimal stable
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - name: Run lib tests
        run: just lib/ test
